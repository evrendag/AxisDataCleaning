name: Apply resample endpoint fix

on:
  push:
    branches:
      - fix/resample-terminal-timestep

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resample-terminal-timestep
          fetch-depth: 0
      - name: Patch endpoint handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('smooth_resampled_traj.py')
          text = path.read_text(encoding='utf-8')
          old = "    new_times = np.arange(t_start, t_end, target_dt)\n"
          new = """    new_times = np.arange(t_start, t_end, target_dt)\n    # np.arange excludes t_end; preserve the terminal robot configuration explicitly.\n    if new_times.size == 0 or not np.isclose(new_times[-1], t_end):\n        new_times = np.append(new_times, t_end)\n    else:\n        new_times[-1] = t_end\n"""
          if old not in text:
              raise SystemExit('expected resampling line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile smooth_resampled_traj.py
          python - <<'PY'
          import numpy as np

          def grid(t_start, t_end, target_dt):
              new_times = np.arange(t_start, t_end, target_dt)
              if new_times.size == 0 or not np.isclose(new_times[-1], t_end):
                  new_times = np.append(new_times, t_end)
              else:
                  new_times[-1] = t_end
              return new_times

          assert np.isclose(grid(0.0, 1.0, 0.1)[-1], 1.0)
          assert np.isclose(grid(0.0, 1.0, 0.3)[-1], 1.0)
          assert np.allclose(grid(0.0, 0.05, 0.1), [0.0, 0.05])
          PY
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-resample-endpoint.yml
          git config user.name "evrendag"
          git config user.email "215058252+evrendag@users.noreply.github.com"
          git add smooth_resampled_traj.py .github/workflows/fix-resample-endpoint.yml
          git commit -m "fix: preserve terminal timestep when resampling"
          git push origin HEAD:fix/resample-terminal-timestep
